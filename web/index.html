<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Write_On</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/editor.css" />
    <link rel="stylesheet" href="styles/chrome.css" />
    <link rel="stylesheet" href="styles/panels.css" />
    <link rel="stylesheet" href="styles/popovers.css" />
  </head>
  <body class="is-booting">
    <div id="scroll">
      <div id="page">
        <div id="underlay" aria-hidden="true"></div>
        <svg id="decor" aria-hidden="true"></svg>
        <div id="editor" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off"></div>
      </div>
    </div>

    <aside id="panel" aria-label="Alternatives">
      <div class="tabs">
        <button class="tab" type="button" data-scope="word">Word</button>
        <button class="tab" type="button" data-scope="sentence">Sentence</button>
        <button class="tab" type="button" data-scope="paragraph">Paragraph</button>
      </div>
      <ol class="rows"></ol>
      <p class="hint">return adds · esc closes</p>
    </aside>

    <!-- The chrome. Icons are drawn to the measurements in the design spec, section 4.3;
         each viewBox has its origin at the middle of the drawing. WebKit paints an inline
         SVG from a whole pixel, so every control sits on whole pixels and any half pixel
         in a drawing's position is written into its viewBox instead. -->
    <button id="wordcount" class="control" type="button" title="Read (Ctrl+Shift+R)"></button>

    <button id="toggle-alternates" class="control chrome icon wide" type="button" aria-label="Show alternatives" aria-pressed="true">
      <svg viewBox="-13 -9 26 18" aria-hidden="true">
        <circle cx="-8.15" cy="-4.15" r="2.58" stroke-width="1.75" />
        <circle class="solid" cx="0" cy="-4.15" r="3.43" />
        <circle cx="8.15" cy="-4.15" r="2.58" stroke-width="1.75" />
        <path d="M-11.37 7.58H11.37" stroke-width="1.66" />
      </svg>
    </button>
    <button id="open-source" class="control chrome icon wide" type="button" aria-label="View source" data-tip="Ctrl+U">
      <svg viewBox="-13 -9 26 18" aria-hidden="true">
        <rect x="-11.37" y="-7.59" width="22.74" height="15.18" rx="2.65" />
        <path d="M-7.03 3.54V-3.64L-3.79 -.4L-.54 -3.64V3.54" />
        <path d="M5.42 -3.5V3.77M2.78 1.13L5.42 3.77L8.06 1.13" />
      </svg>
    </button>
    <button id="open-shortcuts" class="control chrome icon wide" type="button" aria-label="Keyboard shortcuts">
      <svg viewBox="-13 -9 26 18" aria-hidden="true">
        <rect x="-11.37" y="-7.59" width="22.74" height="15.18" rx="2.65" />
        <g class="solid">
          <circle cx="-6.47" cy="-3" r=".79" />
          <circle cx="-2.8" cy="-3" r=".79" />
          <circle cx=".87" cy="-3" r=".79" />
          <circle cx="4.53" cy="-3" r=".79" />
          <circle cx="-6.49" cy=".49" r=".79" />
          <circle cx="-2.79" cy=".49" r=".79" />
          <circle cx=".86" cy=".49" r=".79" />
          <circle cx="3.73" cy=".49" r=".79" />
          <circle cx="6.52" cy=".49" r=".79" />
          <rect x="-4.98" y="3.25" width="10.05" height="1.73" />
        </g>
      </svg>
    </button>

    <button id="save" class="control chrome icon" type="button" aria-label="Save" data-tip="Ctrl+S">
      <svg viewBox="-10 -10 20 20" aria-hidden="true">
        <path d="M-7.58 -7.62H3.53L7.58 -3.57V7.62H-7.58Z" />
        <path d="M-3.46 -7.62V-2.78H2.73V-7.62" />
        <path d="M-4.89 7.62V2.06H4.88V7.62" />
      </svg>
    </button>
    <button id="open" class="control chrome icon" type="button" aria-label="Open" data-tip="Ctrl+O">
      <svg viewBox="-10.5 -10 20 20" aria-hidden="true">
        <path d="M-7.59 -7.62H-1.96L.79 -4.87H7.57V7.62H-7.59Z" />
      </svg>
    </button>
    <button id="post-x" class="control chrome icon" type="button" aria-label="Post to X" data-tip="Ctrl+Shift+P">
      <svg viewBox=".57 .53 22.94 22.94" aria-hidden="true">
        <path class="solid" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
      </svg>
    </button>
    <button id="linkedin" class="control chrome icon" type="button" aria-label="Post to LinkedIn">
      <svg viewBox="-10 -10 20 20" aria-hidden="true">
        <rect x="-7.59" y="-7.59" width="15.18" height="15.18" rx="2.65" />
        <circle class="solid" cx="-3.57" cy="-3.72" r=".8" />
        <path d="M-3.58 -1.07V3.65M-.24 -1.07V3.65M-.24 1.06A2.13 2.13 0 0 1 4.02 1.06V3.65" />
      </svg>
    </button>

    <button id="lab" class="control chrome" type="button" aria-label="The Lab">
      <svg viewBox="0 0 46 26" aria-hidden="true">
        <rect x=".9" y=".5" width="44.4" height="25" rx="4.6" />
      </svg>
      <span>LAB</span>
    </button>
    <button id="toggle-overflow" class="control chrome icon wide" type="button" aria-label="Overflow" aria-pressed="false" data-tip="Ctrl+Shift+D">
      <svg viewBox="-13 -9 26 18" aria-hidden="true">
        <rect x="-11.37" y="-7.59" width="22.74" height="15.18" rx="2.65" />
        <text class="solid" x="0" y="3.46" text-anchor="middle">XYZ</text>
      </svg>
    </button>

    <div id="tooltip" role="tooltip"></div>
    <div id="menu" role="menu"></div>
    <div id="scrim"></div>
    <div id="card" role="dialog" aria-modal="true"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
